<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Marc Digital v3.0</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Capes de fons per les transicions -->
  <div id="bg-layer-1" class="bg-layer active"></div>
  <div id="bg-layer-2" class="bg-layer"></div>

  <!-- Ombra inferior per millorar llegibilitat del text -->
  <div class="scrim-overlay"></div>

  <!-- Capa per reduir la brillantor / Mode Nit -->
  <div id="brightness-overlay"></div>

  <!-- Widget d'informació (Hora, Data i Temps) -->
  <div class="widget-container">
    <div id="weather-box" class="weather-row">
      <span id="weather-icon">--</span>
      <span id="temp-val">--°C</span>
    </div>
    <div id="clock-digital">00:00</div>
    <div id="date-val">Carregant data...</div>
  </div>

  <!-- Botons tàctils de navegació -->
  <button id="btn-prev" class="nav-btn left-btn" aria-label="Anterior">&lt;</button>
  <button id="btn-next" class="nav-btn right-btn" aria-label="Següent">&gt;</button>
  <button id="btn-settings" class="settings-btn" aria-label="Configuració">⚙️</button>

  <!-- Modal de Configuració -->
  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h2>Configuració del Marc Digital v3.0</h2>

      <div class="config-group">
        <label for="range-speed">Interval de canvi de foto: <strong id="speed-val">2 minuts</strong></label>
        <input type="range" id="range-speed" min="0" max="120" step="1" value="2">
      </div>

      <div class="config-group">
        <label for="range-brightness">Brillantor general:</label>
        <input type="range" id="range-brightness" min="10" max="100" step="5" value="100">
      </div>

      <div class="config-group">
        <label for="select-effect">Efecte de transició:</label>
        <select id="select-effect">
          <option value="fade">Suau (Fade)</option>
          <option value="zoom">Zoom suau (Ken Burns)</option>
          <option value="none">Sense efecte (Directe)</option>
        </select>
      </div>

      <div class="config-group">
        <label for="select-position">Posició de la informació:</label>
        <select id="select-position">
          <option value="bottom-right">A baix a la dreta</option>
          <option value="bottom-left">A baix a l'esquerra</option>
          <option value="top-right">A dalt a la dreta</option>
          <option value="top-left">A dalt a l'esquerra</option>
        </select>
      </div>

      <div class="config-group">
        <label for="select-text-size">Mida del text:</label>
        <select id="select-text-size">
          <option value="normal">Normal</option>
          <option value="large">Gran</option>
          <option value="xlarge">Molt gran</option>
        </select>
      </div>

      <div class="config-group checkbox-list">
        <label><input type="checkbox" id="chk-clock" checked> Mostrar Rellotge</label>
        <label><input type="checkbox" id="chk-date" checked> Mostrar Data</label>
        <label><input type="checkbox" id="chk-weather" checked> Mostrar Informació del Temps</label>
      </div>

      <div class="config-group">
        <button id="btn-fullscreen" class="btn-fullscreen">🖥️ Activar / Salir Pantalla Completa</button>
      </div>

      <button id="btn-close-settings" class="btn-close">Guardar i Tancar</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
