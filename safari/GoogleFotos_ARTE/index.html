<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Marc Digital - Streaming Buffer</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Marc Fotos">

  <style>
    * {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #photo-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: -webkit-box;
      display: flex;
      -webkit-box-pack: center;
      justify-content: center;
      -webkit-box-align: center;
      align-items: center;
      background-color: #000000;
    }

    .slide {
      position: absolute;
      max-width: 100%;
      max-height: 100%;
      opacity: 0;
      -webkit-transition: opacity 1.5s ease-in-out;
      transition: opacity 1.5s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    #dimmer-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      -webkit-transition: opacity 0.1s linear;
      transition: opacity 0.1s linear;
    }

    #status-message {
      position: absolute;
      top: 50%;
      left: 50%;
      -webkit-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
      color: #ffffff;
      font-size: 18px;
      text-align: center;
      z-index: 5;
      padding: 20px;
      background-color: rgba(0,0,0,0.7);
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div id="status-message">Inicialitzant buffer d'imatges...</div>
  <div id="photo-container"></div>
  <div id="dimmer-layer"></div>

  <script>
    // ⚠️ 1. LA TEVA URL DE GOOGLE APPS SCRIPT
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzA9bCTO63Dy4jLmvoGV4XjzzW-4AqEeXIoqIsbYNvCSMxp8ncJtKAppCy4SOIM9raneg/exec";
    
    // ⚠️ 2. CONFIGURACIÓ
    var INTERVAL_FOTO = 12000; // Segons per foto (12000ms = 12s)
    var BUFFER_SIZE = 3;       // Mida del buffer (sempre tindrem 3 fotos a la memòria)

    var allUrls = [];          // Totes les URLs de l'àlbum
    var currentIndex = 0;      // Índex de la foto actual que es mostra
    var imageBuffer = {};      // Objecte per guardar els elements d'imatge carregats { index: ImageElement }
    
    var container = document.getElementById('photo-container');
    var statusElem = document.getElementById('status-message');
    var dimmer = document.getElementById('dimmer-layer');
    var activeImgElement = null;

    // 1. Descarregar la llista d'URLs
    function loadPhotoList() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', SCRIPT_URL, true);
      
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              var data = JSON.parse(xhr.responseText);
              if (data.error) {
                statusElem.innerHTML = "Error: " + data.error;
                return;
              }
              if (Array.isArray(data) && data.length > 0) {
                allUrls = data;
                statusElem.style.display = 'none';
                
                // Iniciar el buffer d'estil Streaming
                initStreamingBuffer();
              } else {
                statusElem.innerHTML = "L'àlbum no té fotos.";
              }
            } catch(e) {
              statusElem.innerHTML = "Error en processar la llista de fotos.";
            }
          } else {
            statusElem.innerHTML = "Error de connexió (" + xhr.status + ").";
          }
        }
      };
      xhr.send();
    }

    // 2. Gestionar la cua de precàrrega (Buffer)
    function preloadIndex(idx) {
      // Si la foto ja està al buffer, no fem res
      if (imageBuffer[idx]) return;

      var img = new Image();
      img.className = 'slide';
      
      img.onload = function() {
        // Guardem la imatge a la memòria cau del buffer
        imageBuffer[idx] = img;
      };

      img.onerror = function() {
        console.log("Error carregant la foto de l'índex: " + idx);
      };

      // Inicia la descàrrega en segon pla
      img.src = allUrls[idx];
    }

    function initStreamingBuffer() {
      // Precarrreguem les primeres 3 fotos de la cua inicial
      for (var i = 0; i < BUFFER_SIZE; i++) {
        var targetIndex = (currentIndex + i) % allUrls.length;
        preloadIndex(targetIndex);
      }

      // Esperem 1.5 segons que la primera foto es descarregui i arranquem el passe
      setTimeout(function() {
        startSlideshow();
      }, 1500);
    }

    // 3. Reproductor / Canvi de diapositiva
    function startSlideshow() {
      renderCurrentPhoto();
      setInterval(renderCurrentPhoto, INTERVAL_FOTO);
    }

    function renderCurrentPhoto() {
      if (allUrls.length === 0) return;

      // Agafem la imatge del buffer (si no s'ha descarregat a temps, la creem)
      var imgToDisplay = imageBuffer[currentIndex];

      if (!imgToDisplay) {
        imgToDisplay = new Image();
        imgToDisplay.className = 'slide';
        imgToDisplay.src = allUrls[currentIndex];
      }

      // Inserim la nova foto al panell visual
      container.appendChild(imgToDisplay);

      // Apliquem l'efecte de transició (Fade In)
      setTimeout(function() {
        imgToDisplay.className = 'slide active';
      }, 50);

      // Esborrem visualment la foto anterior
      if (activeImgElement && activeImgElement !== imgToDisplay) {
        var oldImg = activeImgElement;
        oldImg.className = 'slide'; // Fade out
        
        setTimeout(function() {
          if (oldImg && oldImg.parentNode === container) {
            container.removeChild(oldImg);
          }
        }, 1600);
      }

      activeImgElement = imgToDisplay;

      // --- NETEJA I MANTENIMENT DEL BUFFER (Neteja de Memòria RAM) ---
      
      // Calculem quin és l'índex que acaba de "quedar enrere" per esborrar-lo de la RAM
      var lastIndex = (currentIndex - 1 + allUrls.length) % allUrls.length;
      if (imageBuffer[lastIndex]) {
        imageBuffer[lastIndex].src = ""; // Alliberem el pes del fitxer de la memòria de l'iPad
        delete imageBuffer[lastIndex];   // Esborrem la referència
      }

      // Calculem l'índex futur que s'ha de precarregar ara mateix
      var nextToPreload = (currentIndex + BUFFER_SIZE) % allUrls.length;
      preloadIndex(nextToPreload);

      // Avancem l'índex principal
      currentIndex = (currentIndex + 1) % allUrls.length;
    }

    // 4. Control de brillantor per gestos verticals
    var touchStartY = 0;
    var currentDimOpacity = 0;

    document.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        touchStartY = e.touches[0].clientY;
      }
    }, false);

    document.addEventListener('touchmove', function(e) {
      if (e.touches.length === 1) {
        var touchEndY = e.touches[0].clientY;
        var deltaY = touchStartY - touchEndY;

        if (deltaY > 30 && currentDimOpacity < 0.85) {
          currentDimOpacity += 0.05;
          dimmer.style.opacity = currentDimOpacity;
          touchStartY = touchEndY;
        } else if (deltaY < -30 && currentDimOpacity > 0) {
          currentDimOpacity -= 0.05;
          dimmer.style.opacity = currentDimOpacity;
          touchStartY = touchEndY;
        }
        e.preventDefault();
      }
    }, false);

    // Iniciar
    loadPhotoList();
  </script>
</body>
</html>
