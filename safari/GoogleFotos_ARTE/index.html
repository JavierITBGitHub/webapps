<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Marc Digital</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Marc Fotos">

  <style>
    * {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #photo-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: -webkit-box;
      display: flex;
      -webkit-box-pack: center;
      justify-content: center;
      -webkit-box-align: center;
      align-items: center;
      background-color: #000000;
    }

    .slide {
      position: absolute;
      max-width: 100%;
      max-height: 100%;
      opacity: 0;
      -webkit-transition: opacity 1.5s ease-in-out;
      transition: opacity 1.5s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    #dimmer-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      -webkit-transition: opacity 0.1s linear;
      transition: opacity 0.1s linear;
    }

    #status-message {
      position: absolute;
      top: 50%;
      left: 50%;
      -webkit-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
      color: #ffffff;
      font-size: 18px;
      text-align: center;
      z-index: 5;
      padding: 20px;
      background-color: rgba(0,0,0,0.7);
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div id="status-message">Carregant imatges de Google Drive...</div>
  <div id="photo-container"></div>
  <div id="dimmer-layer"></div>

  <script>
    // URL DE GOOGLE APPS SCRIPT CONFIGURADA I VERIFICADA
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwqG0GRYNKjZ7YBSPQtvk-7fLWS-tk5dqxZgnQbMd7B2IE57ZcZgmW4KBkHWbE_WSeB/exec"; 
    
    var INTERVAL_FOTO = 12000; // Canvi de foto cada 12 segons
    var BUFFER_SIZE = 3;       // Manté 3 fotos carregades per no omplir la memòria de l'iPad

    var allUrls = [];
    var currentIndex = 0;
    var imageBuffer = {};
    
    var container = document.getElementById('photo-container');
    var statusElem = document.getElementById('status-message');
    var dimmer = document.getElementById('dimmer-layer');
    var activeImgElement = null;

    function loadPhotoList() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', SCRIPT_URL, true);
      
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              var data = JSON.parse(xhr.responseText);
              if (data.error) {
                statusElem.innerHTML = "Error: " + data.error;
                return;
              }
              if (Array.isArray(data) && data.length > 0) {
                allUrls = data;
                statusElem.style.display = 'none';
                initStreamingBuffer();
              } else {
                statusElem.innerHTML = "La carpeta de Drive no té fotos.";
              }
            } catch(e) {
              statusElem.innerHTML = "Error en processar les dades de Drive.";
            }
          } else {
            statusElem.innerHTML = "Error de connexió (" + xhr.status + ").";
          }
        }
      };
      xhr.send();
    }

    function preloadIndex(idx) {
      if (imageBuffer[idx]) return;

      var img = new Image();
      img.className = 'slide';
      
      img.onload = function() {
        imageBuffer[idx] = img;
      };

      img.src = allUrls[idx];
    }

    function initStreamingBuffer() {
      for (var i = 0; i < BUFFER_SIZE; i++) {
        var targetIndex = (currentIndex + i) % allUrls.length;
        preloadIndex(targetIndex);
      }

      setTimeout(function() {
        startSlideshow();
      }, 1500);
    }

    function startSlideshow() {
      renderCurrentPhoto();
      setInterval(renderCurrentPhoto, INTERVAL_FOTO);
    }

    function renderCurrentPhoto() {
      if (allUrls.length === 0) return;

      var imgToDisplay = imageBuffer[currentIndex];

      if (!imgToDisplay) {
        imgToDisplay = new Image();
        imgToDisplay.className = 'slide';
        imgToDisplay.src = allUrls[currentIndex];
      }

      container.appendChild(imgToDisplay);

      setTimeout(function() {
        imgToDisplay.className = 'slide active';
      }, 50);

      if (activeImgElement && activeImgElement !== imgToDisplay) {
        var oldImg = activeImgElement;
        oldImg.className = 'slide';
        
        setTimeout(function() {
          if (oldImg && oldImg.parentNode === container) {
            container.removeChild(oldImg);
          }
        }, 1600);
      }

      activeImgElement = imgToDisplay;

      // Gestió de memòria RAM (Buffer d'estil streaming)
      var lastIndex = (currentIndex - 1 + allUrls.length) % allUrls.length;
      if (imageBuffer[lastIndex]) {
        imageBuffer[lastIndex].src = "";
        delete imageBuffer[lastIndex];
      }

      var nextToPreload = (currentIndex + BUFFER_SIZE) % allUrls.length;
      preloadIndex(nextToPreload);

      currentIndex = (currentIndex + 1) % allUrls.length;
    }

    // Control de brillantor per gestos verticals
    var touchStartY = 0;
    var currentDimOpacity = 0;

    document.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        touchStartY = e.touches[0].clientY;
      }
    }, false);

    document.addEventListener('touchmove', function(e) {
      if (e.touches.length === 1) {
        var touchEndY = e.touches[0].clientY;
        var deltaY = touchStartY - touchEndY;

        if (deltaY > 30 && currentDimOpacity < 0.85) {
          currentDimOpacity += 0.05;
          dimmer.style.opacity = currentDimOpacity;
          touchStartY = touchEndY;
        } else if (deltaY < -30 && currentDimOpacity > 0) {
          currentDimOpacity -= 0.05;
          dimmer.style.opacity = currentDimOpacity;
          touchStartY = touchEndY;
        }
        e.preventDefault();
      }
    }, false);

    loadPhotoList();
  </script>
</body>
</html>
