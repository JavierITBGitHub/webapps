<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Marc Digital</title>
  
  <!-- Configuració PWA per a iOS / Safari antic -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Marc Fotos">

  <style>
    * {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Contenidor principal de fotos */
    #photo-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
    }

    /* Estil de les fotografies */
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain; /* Manté la proporció sense retallar */
      opacity: 0;
      -webkit-transition: opacity 1.5s ease-in-out;
      transition: opacity 1.5s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    /* Capa fosa per al control de brillantor */
    #dimmer-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      opacity: 0; /* 0 = Brillantor normal, 0.85 = Filtre fosc */
      pointer-events: none;
      z-index: 10;
      -webkit-transition: opacity 0.15s linear;
      transition: opacity 0.15s linear;
    }

    /* Indicador visual de càrrega o error */
    #status-message {
      position: absolute;
      top: 50%;
      left: 50%;
      -webkit-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
      color: #ffffff;
      font-size: 18px;
      text-align: center;
      z-index: 5;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div id="status-message">Carregant àlbum de Google Fotos...</div>
  <div id="photo-container"></div>
  <div id="dimmer-layer"></div>

  <script>
    // ⚠️ ENGANXA AQUÍ LA URL GENERADA PER GOOGLE APPS SCRIPT
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzA9bCTO63Dy4jLmvoGV4XjzzW-4AqEeXIoqIsbYNvCSMxp8ncJtKAppCy4SOIM9raneg/exec";
    
    var INTERVAL_FOTO = 12000; // Canvi de foto cada 12 segons
    var photosList = [];
    var currentIndex = 0;
    
    var container = document.getElementById('photo-container');
    var statusElem = document.getElementById('status-message');
    var dimmer = document.getElementById('dimmer-layer');

    // 1. Obtindre l'àlbum des de la URL d'Apps Script
    function loadPhotos() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', SCRIPT_URL, true);
      
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              var data = JSON.parse(xhr.responseText);
              
              if (data.error) {
                statusElem.innerHTML = "Error: " + data.error;
                return;
              }
              
              if (Array.isArray(data) && data.length > 0) {
                photosList = data;
                statusElem.style.display = 'none';
                initSlideshow();
              } else {
                statusElem.innerHTML = "L'àlbum està buit o no conté fotografies vàlides.";
              }
            } catch(e) {
              statusElem.innerHTML = "Error en processar la resposta del servidor.";
            }
          } else {
            statusElem.innerHTML = "No s'ha pogut connectar amb el servidor (Error " + xhr.status + ").";
          }
        }
      };
      
      xhr.onerror = function() {
        statusElem.innerHTML = "Error de xarxa en carregar l'àlbum.";
      };
      
      xhr.send();
    }

    // 2. Inicialitzar el passe de diapositives
    function initSlideshow() {
      showNextPhoto();
      setInterval(showNextPhoto, INTERVAL_FOTO);
    }

    function showNextPhoto() {
      if (photosList.length === 0) return;

      var imgUrl = photosList[currentIndex];
      var img = document.createElement('img');
      img.className = 'slide';

      img.onload = function() {
        container.appendChild(img);
        
        // Activar la transició d'opacitat
        setTimeout(function() {
          img.className = 'slide active';
        }, 50);

        // Netejar la foto anterior un cop finalitzada la transició
        var oldSlides = container.getElementsByClassName('slide');
        if (oldSlides.length > 1) {
          setTimeout(function() {
            if (oldSlides[0] && oldSlides[0] !== img) {
              container.removeChild(oldSlides[0]);
            }
          }, 1600);
        }
      };

      img.onerror = function() {
        // En cas d'error en una imatge, salta a la següent automàticament
        currentIndex = (currentIndex + 1) % photosList.length;
        setTimeout(showNextPhoto, 1000);
      };

      img.src = imgUrl;
      currentIndex = (currentIndex + 1) % photosList.length;
    }

    // 3. Control de brillantor mitjançant gestos verticals
    var touchStartY = 0;
    var currentDimOpacity = 0;

    window.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        touchStartY = e.touches[0].clientY;
      }
    }, false);

    window.addEventListener('touchmove', function(e) {
      if (e.touches.length === 1) {
        var touchEndY = e.touches[0].clientY;
        var deltaY = touchStartY - touchEndY;

        // Lliscament cap amunt -> Més fosc
        if (deltaY > 25 && currentDimOpacity < 0.85) {
          currentDimOpacity += 0.04;
          touchStartY = touchEndY;
        } 
        // Lliscament cap avall -> Més clar
        else if (deltaY < -25 && currentDimOpacity > 0) {
          currentDimOpacity -= 0.04;
          touchStartY = touchEndY;
        }

        dimmer.style.opacity = currentDimOpacity;
      }
    }, false);

    // Iniciar el procés
    loadPhotos();
  </script>
</body>
</html>
