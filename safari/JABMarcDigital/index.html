<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Marc Digital - Seva</title>
  
  <!-- Opcions PWA / Pantalla Sencera per a iPad / Safari iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Marc Digital">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="img/icona-ipad.png">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Contenidor per al passe de fotos (dues capes per a transició creuada) -->
  <div id="bg-layer-1" class="bg-layer active"></div>
  <div id="bg-layer-2" class="bg-layer"></div>

  <!-- Ombra inferior suau per millorar la llegibilitat dels enllaços/widgets -->
  <div class="scrim-overlay"></div>

  <!-- Targeta d'informació (Hora, Temps i Data) -->
  <div class="widget-container">
    <div class="weather-row">
      <span id="weather-icon">☀️</span>
      <span id="temp-val">--°C</span>
    </div>
    <div id="clock-digital">00:00</div>
    <div id="date-val">carregant data...</div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
