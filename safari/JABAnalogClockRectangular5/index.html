<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JABitxu Clock</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="JABitxu Clock">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="img/icona-ipad.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Mantenim la proporció del viewBox, s'adaptarà geomètricament des de JS sense deformar elements -->
<svg id="clock-svg"
     viewBox="-666.5 -500 1333 1000"
     preserveAspectRatio="xMidYMid meet">

    <defs>
        <filter id="minuteGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Marques -->
    <g id="marks"></g>

    <!-- Números (Amb transform-override des de JS per evitar que rotin o es deformin) -->
    <g id="numbers"></g>

    <!-- Textos -->
    <text id="brand" y="-120">JABitxu</text>
    <text id="temp" y="180">--°C</text>
    <text id="date" y="250">----</text>

    <!-- Grup de Manetes: Dibuixades en coordenades 0,0 mirant cap a les 12 hores (vertical amunt) -->
    <!-- Maneta de les hores amb punta, base arrodonida i nervi central -->
    <g id="h-hand-group">
        <path class="h-hand-main" d="M -7 30 L -7 -230 L 0 -250 L 7 -230 L 7 30 Z" />
        <line class="h-hand-nerve" x1="0" y1="20" x2="0" y2="-220" />
    </g>
    
    <!-- Maneta dels minuts estil estilitzat amb punta llarga -->
    <g id="m-hand-group">
        <polygon class="m-hand-main" points="-4,30 -4,-360 0,-385 4,-360 4,30" />
    </g>
    
    <!-- Maneta dels segons rectilínia fina clàssica vermella -->
    <line id="s-hand" x1="0" y1="40" x2="0" y2="-420" />

    <!-- Centre -->
    <circle cx="0" cy="0" r="8" fill="#ff0000" style="z-index:100;"/>

</svg>

<script src="js/clock.js"></script>
</body>
</html>
