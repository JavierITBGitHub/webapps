<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JABitxu Clock</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="JABitxu Clock">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="img/icona-ipad.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- viewBox modificat a 4:3 per a la pantalla completa de l'iPad -->
<svg id="clock-svg"
     viewBox="-666.5 -500 1333 1000"
     preserveAspectRatio="none"> <!-- Força a estirar-se als límits absoluts si cal -->

    <defs>
        <filter id="minuteGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Marques -->
    <g id="marks"></g>

    <!-- Números -->
    <g id="numbers"></g>

    <!-- Textos -->
    <text id="brand" y="-120">JABitxu</text>
    <text id="temp" y="180">--°C</text>
    <text id="date" y="240">----</text>

    <!-- Manetes -->
    <line id="h-hand"/>
    <line id="m-hand"/>
    <line id="s-hand"/>

    <!-- Centre -->
    <circle cx="0" cy="0" r="6" fill="#ff0000"/>

</svg>

<script src="js/clock.js"></script>
</body>
</html>
